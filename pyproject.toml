[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langmuir-probe-iv-sweep"
version = "0.1.0"
description = "Acquire and analyze Langmuir probe I-V traces with the Aim-TTi SMU4201"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["numpy", "matplotlib", "PyQt5", "PyVISA"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "build"]

[project.scripts]
langmuir-sweep = "langmuir_probe.gui:main"
langmuir-analyze = "langmuir_probe.analysis:main"

[tool.hatch.build.targets.wheel]
packages = ["src/langmuir_probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

